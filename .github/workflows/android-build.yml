name: Build Android APK (PakEdu Portal)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1: Check out the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java JDK 21 (Temurin distribution for Capacitor 8)
      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # Step 3: Set up Android SDK & Install Build-Tools 36.0.0
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
            packages: 'platform-tools'
      - name: Install Android Build-Tools 36.0.0
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;36.0.0"

      # Step 4: Set up Node.js 24
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      # Step 5: Install NPM Dependencies
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # Step 6: Build Vite Production Bundle (with secure GitHub Secrets)
      - name: Build Web Application (Vite)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_FIRESTORE_DATABASE_ID }}
        run: npm run build

      # Step 7: Sync Web Assets to Native Android Project
      - name: Sync Capacitor Android Project
        run: npx cap sync android

      # Step 8: Grant Execute Permissions to Gradle Wrapper (Gradle 8.14.3)
      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      # Step 9: Build Debug APK using Gradle
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      # Step 10: Upload Debug APK as a Downloadable Artifact
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PakEdu-Portal-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
